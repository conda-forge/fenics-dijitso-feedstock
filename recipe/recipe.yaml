schema_version: 1

context:
  version: "2019.1.0"

package:
  name: fenics-dijitso
  version: ${{ version }}

source:
  url: https://bitbucket.org/fenics-project/dijitso/downloads/dijitso-${{ version }}.tar.gz
  sha256: eaa45eec4457f3f865d72a926b7cba86df089410e78de04cd89b15bb405e8fd9
  patches:
    - setuptools82.patch

build:
  number: 41
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy

tests:
  - python:
      imports:
        - dijitso
      pip_check: false
      python_version: ${{ python_min }}
about:
  license: LGPL-3.0-or-later
  license_file:
    - COPYING
    - COPYING.LESSER
  summary: A Python module for distributed just-in-time shared library building
  description: |
    FEniCS is a collection of free software for automated, efficient solution of differential equations
    (https://fenicsproject.org). It provides C++ and Python interfaces, and creates effecient solvers via
    expression of finite variational statements in a domain-specific language that are transformed and
    just-in-time compiled into efficient implementations.
  homepage: http://www.fenicsproject.org
  repository: https://bitbucket.org/fenics-project/
  documentation: https://fenics.readthedocs.io

extra:
  recipe-maintainers:
    - garth-wells
    - johannesring
    - mikaem
    - minrk
    - jan-janssen
    - sblauth
